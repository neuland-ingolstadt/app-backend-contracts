name: Release contracts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level id-token is required for npm Trusted Publishing (OIDC).
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
      # Do NOT set NODE_AUTH_TOKEN / NPM_TOKEN — empty tokens block OIDC.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Do NOT pass registry-url — setup-node would write
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and OIDC never runs.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v22.16.0
        with:
          node-version: 26
          cache: npm

      - run: npm install -g npm@latest

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - run: npm ci

      - run: npx semantic-release
