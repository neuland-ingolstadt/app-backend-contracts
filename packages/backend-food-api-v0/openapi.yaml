openapi: 3.1.1

info:
  title: Neuland Backend Food API
  version: 1.0.0
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-or-later

servers:
  - url: https://api.neuland.app/food/v1
    description: Production (shared api.neuland.app)

security: [ ]

tags:
  - name: food
    description: Everything about the food offering of mensas and restaurants

paths:
  /meals:
    get:
      operationId: listMeals
      tags: [ food ]
      summary: Get meals
      description: Retrieve meals offered by restaurants within a specified date range
      security: [ ]
      parameters:
        - $ref: '#/components/parameters/Restaurants'
        - $ref: '#/components/parameters/MealDateFrom'
        - $ref: '#/components/parameters/MealDateTo'
      responses:
        '200':
          description: Meals retrieved successfully
          content:
            application/json:
              schema:
                type: array
                description: Days within the requested range that have at least one meal. Days without meals are omitted.
                items:
                  $ref: '#/components/schemas/MealDay'
        '400':
          description: Bad request
        default:
          $ref: '#/components/responses/Problem'

  /meals/{mealId}:
    parameters:
      - $ref: '#/components/parameters/MealId'
    get:
      operationId: getMeal
      tags: [ food ]
      summary: Get a meal by ID
      description: Retrieve a specific meal by its unique identifier
      security: [ ]
      responses:
        '200':
          description: Meal retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        '404':
          description: Meal not found
        default:
          $ref: '#/components/responses/Problem'

components:
  parameters:
    Restaurants:
      name: restaurants
      in: query
      required: true
      description: Restaurant(s) for which to retrieve meals
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/Restaurant'
        minItems: 1
        uniqueItems: true
      example: [ INGOLSTADT_MENSA, REIMANNS ]

    MealDateFrom:
      name: mealDateFrom
      in: query
      required: true
      description: Start date for which to retrieve meals (inclusive)
      schema:
        type: string
        format: date

    MealDateTo:
      name: mealDateTo
      in: query
      required: true
      description: End date for which to retrieve meals (inclusive)
      schema:
        type: string
        format: date

    MealId:
      name: mealId
      in: path
      required: true
      description: Unique identifier of the meal on the specific day
      schema:
        type: string

  responses:
    Problem:
      description: An error occurred
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    LocalizedString:
      type: object
      description: Localized text in German and English
      required:
        - de
        - en
      properties:
        de:
          type: string
          minLength: 1
          description: German text
        en:
          type: string
          minLength: 1
          description: English text
      examples:
        - de: Currywurst mit Pommes
          en: Curry sausage with fries

    LanguageEnum:
      type: string
      description: Supported language
      enum:
        - de
        - en

    Problem:
      type: object
      description: Problem Details response as defined by RFC 9457
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference identifying the problem type
        title:
          type: string
          description: Short, human-readable summary of the problem type
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server
          examples: [ 503 ]
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          examples:
            - Connection to database timed out
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence of the problem

    MealDay:
      type: object
      description: Meals offered on a specific day, across all requested restaurants
      required:
        - date
        - meals
      properties:
        date:
          type: string
          format: date
          description: Day on which the meals are offered
        meals:
          type: array
          description: Meals offered on this day
          items:
            $ref: '#/components/schemas/Meal'

    Meal:
      type: object
      description: A meal offered by a restaurant on a specific day
      required:
        - id
        - name
        - category
        - price
        - originalLanguage
        - static
        - restaurant
      properties:
        id:
          type: string
          description: Unique identifier of the meal on the specific day
        name:
          $ref: '#/components/schemas/LocalizedString'
        category:
          $ref: '#/components/schemas/MealCategory'
        price:
          $ref: '#/components/schemas/MealPrice'
        allergens:
          type: array
          description: List of allergens (e.g. gluten, lactose, etc.)
          items:
            type: string
        flags:
          type: array
          description: List of flags (e.g. vegan, vegetarian, etc.)
          items:
            type: string
        nutrition:
          $ref: '#/components/schemas/Nutrition'
        originalLanguage:
          $ref: '#/components/schemas/LanguageEnum'
        static:
          type: boolean
          description: Static meals are always available, non-static meals are only available on specific days
          examples: [ false ]
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        variations:
          type: array
          description: Variants or toppings of the meal, like bread, sauce, etc.
          items:
            $ref: '#/components/schemas/MealVariation'

    MealVariation:
      type: object
      description: A variant or topping of a meal, like bread, sauce, etc.
      required:
        - id
        - name
        - additional
        - price
        - originalLanguage
        - static
        - restaurant
      properties:
        id:
          type: string
          description: Unique identifier of the variant
        name:
          $ref: '#/components/schemas/LocalizedString'
        additional:
          type: boolean
          description: Whether the variant is an extra topping rather than a core meal option
          examples: [ true ]
        price:
          $ref: '#/components/schemas/MealPrice'
        allergens:
          type: array
          description: List of allergens (e.g. gluten, lactose, etc.)
          items:
            type: string
        flags:
          type: array
          description: List of flags (e.g. vegan, vegetarian, etc.)
          items:
            type: string
        nutrition:
          $ref: '#/components/schemas/Nutrition'
        originalLanguage:
          $ref: '#/components/schemas/LanguageEnum'
        static:
          type: boolean
          description: Static variants are always available, non-static variants are only available on specific days
          examples: [ false ]
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        parentMealId:
          type: string
          description: ID of the parent meal to which this variation belongs

    MealPrice:
      type: object
      description: Prices for different types of customers
      required:
        - student
        - employee
        - guest
      properties:
        student:
          type: number
          format: float
          description: Price for students
          examples: [ 3.9 ]
        employee:
          type: number
          format: float
          description: Price for employees
          examples: [ 4.9 ]
        guest:
          type: number
          format: float
          description: Price for guests
          examples: [ 5.9 ]

    MealCategory:
      type: string
      description: Category of the meal
      enum:
        - MAIN
        - SOUP
        - SALAD
        - OTHER
      examples: [ MAIN ]

    Restaurant:
      type: string
      description: Restaurant where meals are offered
      enum:
        - INGOLSTADT_MENSA
        - NEUBURG_MENSA
        - REIMANNS
        - CANISIUS
      examples: [ INGOLSTADT_MENSA ]

    Nutrition:
      type: object
      description: Nutritional information about a meal
      required:
        - kj
        - kcal
        - fat
        - fatSaturated
        - carbs
        - sugar
        - fiber
        - protein
        - salt
      properties:
        kj:
          type: number
          format: double
          description: Energy in kilojoules
          examples: [ 1500 ]
        kcal:
          type: number
          format: double
          description: Energy in kilocalories
          examples: [ 358 ]
        fat:
          type: number
          format: double
          description: Fat in grams
          examples: [ 12.5 ]
        fatSaturated:
          type: number
          format: double
          description: Saturated fat in grams
          examples: [ 4.2 ]
        carbs:
          type: number
          format: double
          description: Carbohydrates in grams
          examples: [ 45.3 ]
        sugar:
          type: number
          format: double
          description: Sugar in grams
          examples: [ 5.1 ]
        fiber:
          type: number
          format: double
          description: Fiber in grams
          examples: [ 3.2 ]
        protein:
          type: number
          format: double
          description: Protein in grams
          examples: [ 15.8 ]
        salt:
          type: number
          format: double
          description: Salt in grams
          examples: [ 2.1 ]
