name: Validate OpenAPI

on:
  pull_request:
    paths:
      - 'oas/**/*.yaml'
      - 'oas/**/*.yml'
      - 'oas/**/*.json'
      - '.github/workflows/validate-openapi.yml'

jobs:
  openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint OpenAPI
        shell: bash
        run: |
          mapfile -d '' specs < <(
            find oas -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) -print0 2>/dev/null
          )

          if [[ ${#specs[@]} -eq 0 ]]; then
            echo 'No OpenAPI files found under oas/'
            exit 0
          fi

          for spec in "${specs[@]}"; do
            npx --yes @redocly/cli@2.47.0 lint "$spec" --format=github-actions
          done
