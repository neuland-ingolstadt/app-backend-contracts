name: Publish npm package for existing tag

# Catch-up: publish @neuland-ingolstadt/backend-core-api-v0 for a Git tag that
# already released Maven before npm packaging existed (e.g. 1.0.4).
# Uses packaging scripts from the workflow ref (usually main) and the OpenAPI
# document from the requested tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without leading v (must match an existing git tag)
        required: true
        type: string
        default: '1.0.4'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout packaging (workflow ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Overlay OpenAPI from tag v${{ inputs.version }}
        run: |
          git fetch --depth=1 origin "refs/tags/v${{ inputs.version }}:refs/tags/v${{ inputs.version }}"
          git checkout "v${{ inputs.version }}" -- oas/backend-core-api-v0.yaml

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v22.16.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@neuland-ingolstadt'

      - run: npm ci
      - run: npm run build:npm

      - name: Set version and publish
        working-directory: packages/backend-core-api-v0
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          npm publish
